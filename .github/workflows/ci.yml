name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Validate Datasets
        run: pnpm test:data
      - name: Run unit tests
        run: pnpm test
      - name: Build applications and packages
        run: pnpm build
      - name: Install supported browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser release checks
        run: pnpm test:e2e --workers=1
      - name: Enforce production performance budgets
        run: pnpm test:performance
